# DeltaServe-on-vLLM serving config — TP=2 co-serving finetuning (Llama-3).
#
# Phase 7 / TP work. Same structure as serving_config_finetuning_llama3.yaml,
# but tensor_parallel_size=2 and the shard-UNAWARE backward optimizations are
# turned OFF until the milestones that make them shard-correct land:
#   - backward_cuda_graph        : ON — TP-safe since M5 (no collective is captured; the
#                                 forward graph is split at the o-proj output and its
#                                 all-reduce runs eagerly). Expect "(graph)" cycle lines
#                                 and "[bwd-graph] pre-captured forward 32/32 …" from
#                                 each child; set false for the eager side of the A/B.
#   - save_attn_qkv / ctx        : ON — M2 made these buffers local-width, and a
#                                 TP=2 run with both ON completed 162 cycles with
#                                 no shape errors.
#   - forward_interruptible      : ON — tier C is rank-symmetric under TP (shm arrival
#                                 counter + a gloo MAX-reduce per layer boundary)
#
# STATUS: M1-M4.1 have landed and are GPU-validated — TP=2 now trains equivalently
# to TP=1 (cycle-for-cycle to ~0.01 loss on identical data), so POSTing
# /start_finetuning is expected to work. `start_on_launch: false` still holds FT
# admission closed until that POST, which keeps profiling/warmup FT-free.
#
# M4.2 landed: the SLO estimator's timing feedback + the backward ack agreement
# ride the TP relay, so `profile_on_launch` is ON and FT admission is SLO-gated.

finetune:
  enable_finetuning: true
  start_on_launch: false             # hold FT admission closed (M1: launch-only)
  backward_mps_percentage: 10
  finetuning_lora_path: ../adapters/llama3-toy-lora-ft
  data_path: ../alpaca_1000.txt
  max_saved_finetuning_tokens: 256
  backward_sleep_seconds: 2.0
  num_epochs: 20
  learning_rate: 0.000005
  weight_decay: 0.01
  gamma: 0.9
  backward_fp32: false
  forward_interruptible: true        # tiers A/B (scheduler) + tier C rank-symmetric under TP
  ft_only_admission_grace_ms: 2.0
  pause_until_prefill_done: true     # no MPS on this box: keep the bwd paused until the prefill has finished on the GPU
  fwd_token_throttle_enable: false
  fwd_token_throttle: 200
  backward_cuda_graph: true          # TP-safe since M5 (set false for the eager side of the A/B)
  save_attn_qkv: true                # post-RoPE q/k/v saved: skips the Q/K/V GEMM + RoPE (local-width since M2)
  save_attn_ctx: true                # attention context saved: skips the attention forward (local-width since M2)
  save_resid_mid: true               # save post-attn residual: drops the forward-remat o all-reduce (7 → 6 collectives/layer) + the O-proj GEMM; +64 MB

slo:
  ttft_slo: 0.25
  avg_tbt_slo: 0.02
  max_tbt_slo: 0.05
  # M4.2: the runner's per-step timing samples and the profiling pass's
  # record gate now ride the TP relay (ModelRunnerOutput.finetune_timing /
  # SchedulerOutput.finetune_record_timing), so the launch-time profiling
  # pass fits a real, TP-calibrated estimator and FT admission is SLO-gated
  # under TP exactly as on a single GPU. Set false to fall back to the
  # cold-start fixed buffer-cap budget (no SLO gate).
  profile_on_launch: true
  profile_num_repeats: 2
  ft_tokens_admission_constrain_factor: -1
  match_prefill_workload_factor: 0
  decode_only_ft_safety_margin: 0.7

debug:
  print_weight_hash: false
  print_activation_hash: false
  print_scheduler_add: true
  print_engine_batch_exec: true
  print_engine_batch_done: false
  print_engine_req_recv: false

adapters:
  lora_path_0: ../adapters/llama3-toy-lora

lora:
  enable_lora: true
  max_loras: 2
  max_lora_rank: 16

server:
  host: 127.0.0.1
  port: 8000
  rank_id: 0
  # Single frontend for TP bring-up (fewer moving parts in the launch prints).
  api_server_count: 1

model:
  model: meta-llama/Meta-Llama-3-8B
  tokenizer_mode: auto
  trust_remote_code: false
  dtype: auto
  max_model_len: 2048

engine:
  gpu_memory_utilization: 0.85
  enforce_eager: false
  disable_log_stats: true

parallel:
  tensor_parallel_size: 2            # <<< TP=2
